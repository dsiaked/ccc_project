apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ccc-bus-allocation-optimizer
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      taskCount: 1
      template:
        spec:
          maxRetries: 0
          timeoutSeconds: "86400"
          containers:
            - image: asia-northeast3-docker.pkg.dev/ccc-bus-optimizer-20260608/ccc-bus/allocation-optimizer:latest
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: SUPABASE_URL
                  value: https://pjbvxoesgwhbxfsfjliw.supabase.co
                - name: ALLOCATION_OPTIMIZER_EXECUTION_MODE
                  value: cloud
                - name: ALLOCATION_OPTIMIZER_MAX_SECONDS
                  value: "3600"
                - name: SUPABASE_SERVICE_ROLE_KEY
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: ccc-bus-supabase-service-role-key
          serviceAccountName: ccc-bus-optimizer-runtime@ccc-bus-optimizer-20260608.iam.gserviceaccount.com
